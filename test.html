/* =========================
   VARIABLES
========================= */

let left = 20 * 60;
let done = false;


/* =========================
   AFFICHAGE DES QUESTIONS
========================= */

function renderQuestions(){

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    qs.forEach(function(q, i){

        const card = document.createElement("div");

        card.className = "card";
        card.id = "question-" + i;

        let html = "";

        html += '<div class="q">';
        html += (i + 1) + ". " + q[0];
        html += "</div>";

        q[1].forEach(function(option, j){

            html += '<label>';

            html += '<input type="radio" ';
            html += 'name="question' + i + '" ';
            html += 'value="' + j + '"> ';

            html += String.fromCharCode(65 + j);
            html += ". ";
            html += option;

            html += "</label>";

        });

        card.innerHTML = html;

        quiz.appendChild(card);

    });

}


/* =========================
   CHRONOMÈTRE
========================= */

function updateTimer(){

    if(done){
        return;
    }

    const minutes = Math.floor(left / 60);

    const seconds = left % 60;

    document.getElementById("timer").textContent =
        minutes + ":" + String(seconds).padStart(2, "0");

    if(left <= 0){

        finish();

        return;
    }

    left--;

}


/* =========================
   CORRECTION
========================= */

function finish(){

    if(done){
        return;
    }

    done = true;

    let score = 0;

    qs.forEach(function(q, i){

        const selected = document.querySelector(
            'input[name="question' + i + '"]:checked'
        );

        const card = document.getElementById("question-" + i);
        const labels = card.querySelectorAll("label");

        const correctIndex = q[2];
        const explanation = q[3];

        // Désactiver toutes les options après soumission
        const inputs = card.querySelectorAll("input");
        inputs.forEach(input => input.disabled = true);

        let userIndex = selected ? parseInt(selected.value) : -1;

        if (userIndex === correctIndex) {
            score++;
            card.classList.add("good");
        } else {
            card.classList.add("bad");
        }

        // Coloration visuelle des réponses (Vert pour correct, Rouge pour erreur)
        labels.forEach((label, j) => {
            if (j === correctIndex) {
                label.style.background = "#d1e7dd";
                label.style.borderColor = "#a3cfbb";
                label.style.fontWeight = "bold";
            } else if (j === userIndex) {
                label.style.background = "#f8d7da";
                label.style.borderColor = "#f5c2c7";
            }
        });

        // Ajout de l'explication sous la question
        const expDiv = document.createElement("div");
        expDiv.className = "small";
        expDiv.style.marginTop = "10px";
        expDiv.style.paddingTop = "10px";
        expDiv.style.borderTop = "1px dashed #ddd";
        expDiv.innerHTML = "<strong>💡 Explication :</strong> " + explanation;
        card.appendChild(expDiv);
    });

    // Affichage et calcul du score final
    const resultDiv = document.getElementById("result");
    const pourcent = Math.round((score / qs.length) * 100);
    
    let comment = pourcent >= 70 ? "🎉 Félicitations ! Vous avez validé ce test." : "❌ Score insuffisant. Continuez à réviser !";
